# Клиент-серверный стенд для модуля 12.
# Минимум: только СУБД (сервер 1С ставится нативно на хост).
#   docker compose up -d mssql
# Полностью в контейнерах: соберите образ сервера через onec-docker и раскомментируйте onec-server.
name: onec-lab

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: onec-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"                    # бесплатная редакция для разработки и тестирования
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_COLLATION: "Cyrillic_General_CI_AS" # сортировка, ожидаемая 1С для русскоязычных баз
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

